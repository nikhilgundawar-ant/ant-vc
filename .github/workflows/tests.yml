name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    name: Engine, guard and safety lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Engine checks and multi-run suites (guard included)
        run: python3 evals/runner.py
      - name: Engine fuzz
        run: python3 evals/stress/engine_fuzz.py | tee fuzz.txt && ! grep -q '^FAIL' fuzz.txt
      - name: Skills never tell Claude to send, delete or share
        run: python3 -I -S engine/instinct.py lint --root skills && python3 -I -S engine/instinct.py lint --root shared
      - name: Design lint
        run: python3 evals/design_lint.py
  home:
    name: ant. Home in a real browser
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Playwright's own image: Python, Chromium and its system libraries, already matched.
    container: mcr.microsoft.com/playwright/python:v1.56.0-noble
    defaults:
      run:
        shell: bash  # a container's default is sh, which has no pipefail
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Playwright comes with the image
        run: python3 -c "import playwright, importlib.metadata as m; print('playwright', m.version('playwright'))"
      - name: Home QA
        run: python3 evals/home_qa.py | tee home.txt && ! grep -q '^FAIL' home.txt
      - name: Stress suites
        run: |
          set -o pipefail
          for f in egress security_012 panels_send data_security a11y_layout reminders_ask_pdf; do
            python3 evals/stress/$f.py | tee $f.txt
            if grep -q '^FAIL' $f.txt; then echo "::error::$f has failing checks"; exit 1; fi
          done
  image-digest:
    name: Report the Playwright image digest (for pinning)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Look up the digest
        run: |
          docker pull -q mcr.microsoft.com/playwright/python:v1.56.0-noble >/dev/null
          echo "::notice title=playwright-digest::$(docker inspect --format '{{index .RepoDigests 0}}' mcr.microsoft.com/playwright/python:v1.56.0-noble)"
