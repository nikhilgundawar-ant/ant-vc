<title>ant. Home</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Raleway:wght@200;700&display=swap">
<style>
/* ant. Home on the Anthill design system, Evergreen v2026.09.08.
   Layout: one column with a bottom tab bar under 760px; a 64px rail above it; hero and agenda side by side from 1100px. */
:root { color-scheme: light;
  --ah-hero: #344C3D; --ah-hero-fill: #344C3D; --ah-hero-hover: #263A2E;
  --ah-sage: #BFCFBB; --ah-mid-sage: #8EA58C;
  --ah-tint: #EDF2EC; --ah-tint-hover: #DCE6D9;
  --ah-breach: #F87171; --ah-breach-ink: #B3261E; --ah-breach-tint: #FEF0EF;
  --ah-page: #F4F6F2; --ah-surface: #FFFFFF; --ah-modal: #FFFFFF;
  --ah-surface-2: #EDF2EC; --ah-control-2: #E7EBE3;
  --ah-ink: #0B0B0C; --ah-ink-2: #55555C; --ah-ink-3: #6E6E76; --ah-on-hero: #FFFFFF;
  --ah-overlay-ink: #0B0B0C; --ah-overlay-text: #F4F6F2; --ah-overlay-edge: rgba(244, 246, 242, .35);
  --ah-row-rule: rgba(11, 11, 12, .06); --ah-outline: rgba(52, 76, 61, .32); --ah-rail-edge: rgba(11, 11, 12, .05);
  --ah-field: rgba(11, 11, 12, .46); --ah-halo: rgba(52, 76, 61, .26); --ah-scrim: rgba(11, 11, 12, .32);
  --ah-track: #BFCFBB;
  --ah-elev-1: 0 1px 2px rgba(11, 11, 12, .04), 0 14px 30px -22px rgba(11, 11, 12, .35);
  --ah-elev-2: 0 1px 2px rgba(11, 11, 12, .04), 0 24px 48px -28px rgba(11, 11, 12, .35);
  --ah-elev-3: 0 2px 6px rgba(11, 11, 12, .08), 0 40px 80px -30px rgba(11, 11, 12, .5);
  --ah-elev-hero: 0 1px 2px rgba(11, 11, 12, .04), 0 30px 56px -30px rgba(52, 76, 61, .45);
  --ah-elev-tile: 0 8px 16px -10px rgba(11, 11, 12, .3);
  --ah-elev-overlay: 0 24px 48px -20px rgba(11, 11, 12, .6);
  --ah-display: "Raleway", Georgia, serif;
  --ah-body: "Nunito", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --ah-ease: cubic-bezier(.2, .8, .2, 1);
}
/* Light is the default on every device. Dark (Inkwell) is the user's choice, set by the switch in the header and remembered. */
:root[data-ah-theme="dark"] {
  --ah-hero: #BFCFBB; --ah-hero-fill: #8EA58C; --ah-hero-hover: #CFDCCB;
  --ah-tint: rgba(191, 207, 187, .14); --ah-tint-hover: rgba(191, 207, 187, .22);
  --ah-breach-ink: #FB9797; --ah-breach-tint: rgba(248, 113, 113, .15);
  --ah-page: #0E1310; --ah-surface: #172019; --ah-modal: #233027;
  --ah-surface-2: #111713; --ah-control-2: #223028;
  --ah-ink: #F4F6F2; --ah-ink-2: #ABB4AC; --ah-ink-3: #949E96; --ah-on-hero: #0E1310;
  --ah-overlay-ink: #F4F6F2; --ah-overlay-text: #0B0B0C; --ah-overlay-edge: rgba(11, 11, 12, .3);
  --ah-row-rule: rgba(244, 246, 242, .07); --ah-outline: rgba(191, 207, 187, .36); --ah-rail-edge: rgba(244, 246, 242, .06);
  --ah-field: rgba(244, 246, 242, .42); --ah-halo: rgba(191, 207, 187, .3); --ah-scrim: rgba(0, 0, 0, .55);
  --ah-track: #2C3A30;
  --ah-elev-1: 0 1px 2px rgba(0, 0, 0, .3), 0 14px 30px -22px rgba(0, 0, 0, .85);
  --ah-elev-2: 0 1px 2px rgba(0, 0, 0, .3), 0 24px 48px -28px rgba(0, 0, 0, .85);
  --ah-elev-3: 0 2px 6px rgba(0, 0, 0, .35), 0 40px 80px -30px rgba(0, 0, 0, .9);
  --ah-elev-hero: 0 1px 2px rgba(0, 0, 0, .3), 0 30px 56px -30px rgba(0, 0, 0, .85);
  --ah-elev-tile: 0 8px 16px -10px rgba(0, 0, 0, .7);
  --ah-elev-overlay: 0 24px 48px -20px rgba(0, 0, 0, .8);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ah-page); color: var(--ah-ink); font-family: var(--ah-body); font-size: 15px; line-height: 1.55;
  -webkit-font-smoothing: antialiased; font-feature-settings: "lnum" 1, "tnum" 1; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ah-page); }
button, input, select { font: inherit; color: inherit; }
a { color: var(--ah-hero); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--ah-hero); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; }
p { text-wrap: pretty; }

/* Shell */
.ah-shell { display: grid; grid-template-columns: 1fr; min-height: 100vh; }
.ah-rail { display: none; }
.ah-main { min-width: 0; padding-block: 16px calc(80px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ah-main-inner { max-width: 1080px; margin: 0 auto; display: grid; gap: 20px; }
.ah-hdr { display: flex; align-items: center; gap: 12px; min-height: 32px; }
.ah-brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.ah-mark { width: 24px; height: 24px; display: block; flex: none; }
.ah-name { font-family: var(--ah-body); font-weight: 800; font-size: 22px; line-height: 1; letter-spacing: -.02em; color: var(--ah-ink); }
.ah-date { margin-left: auto; font-weight: 600; font-size: 15px; color: var(--ah-ink-2); white-space: nowrap; }
.ah-live { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; flex: none;
  background: var(--ah-tint); color: var(--ah-hero); font-weight: 600; font-size: 11.5px; white-space: nowrap; }
.ah-live i { width: 6px; height: 6px; border-radius: 999px; background: var(--ah-mid-sage); animation: ah-pulse 2.4s var(--ah-ease) infinite; }
.ah-live.is-old { background: var(--ah-control-2); color: var(--ah-ink-2); }
.ah-live.is-old i { animation: none; background: var(--ah-ink-2); }
@keyframes ah-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
.ah-help { width: 40px; height: 40px; margin: -8px -10px -8px -6px; border: 0; padding: 0; background: transparent; cursor: pointer;
  display: grid; place-items: center; flex: none; border-radius: 9px; }
.ah-help span { width: 19px; height: 19px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px var(--ah-outline); color: var(--ah-hero);
  font-weight: 800; font-size: 11.5px; display: grid; place-items: center; transition: transform 80ms var(--ah-ease); }
.ah-help:hover span { transform: translateY(-1px); }
.ah-icon-btn { width: 40px; height: 40px; margin: -8px -6px; border: 0; padding: 0; background: transparent; cursor: pointer; flex: none;
  display: grid; place-items: center; border-radius: 9px; color: var(--ah-hero); }
.ah-icon-btn svg { width: 18px; height: 18px; transition: transform 80ms var(--ah-ease); }
.ah-icon-btn:hover svg { transform: translateY(-1px); }
.ah-icon-btn[aria-current="page"] { background: var(--ah-tint); }
.act-lbl { display: none; font-weight: 700; font-size: 13px; }
@media (min-width: 760px) { #activity-btn { width: auto; padding: 0 12px; margin: -8px 0; gap: 6px; display: inline-flex; align-items: center; } #activity-btn .act-lbl { display: inline; } }
@media (pointer: coarse) { .keys-only { display: none; } }
.seg { display: inline-flex; gap: 4px; padding: 2px; border-radius: 999px; background: var(--ah-control-2); }
.seg .chip { background: transparent; color: var(--ah-ink-2); }
.seg .chip[aria-pressed="true"] { background: var(--ah-hero); color: var(--ah-on-hero); }

/* Tabs: bottom bar on phones, rail from 760px */
.ah-tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--ah-surface); box-shadow: 0 -1px 0 var(--ah-rail-edge); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.ah-tab { display: grid; justify-items: center; gap: 2px; padding: 6px 2px; min-height: 56px; border: 0; background: transparent;
  color: var(--ah-ink-2); font-weight: 600; font-size: 11.5px; cursor: pointer; border-radius: 9px; }
.ah-tab svg { width: 18px; height: 18px; }
.ah-tab-ico { width: 44px; height: 28px; border-radius: 9px; display: grid; place-items: center; transition: background 120ms var(--ah-ease); }
.ah-tab[aria-selected="true"] { color: var(--ah-hero); }
.ah-tab[aria-selected="true"] .ah-tab-ico { background: var(--ah-hero); color: var(--ah-on-hero); }

/* Tiles */
/* Only controls lift under the pointer: a card you read stays still. */
.card { background: var(--ah-surface); border-radius: 12px; box-shadow: var(--ah-elev-1); padding: 16px; min-width: 0; }
.ruled { position: relative; overflow: hidden; box-shadow: var(--ah-elev-hero); }
.ruled::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--ah-hero-fill); }
.ruled.is-breach::before { background: var(--ah-breach); }
.ruled:hover { box-shadow: var(--ah-elev-hero); }
.ah-hero-card { padding: 24px 20px 20px 24px; display: grid; gap: 16px; }
.kicker { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; color: var(--ah-ink-2); }
.kicker i { width: 7px; height: 7px; border-radius: 999px; background: var(--ah-hero-fill); flex: none; }
.is-breach .kicker i { background: var(--ah-breach); }
.statement { font-family: var(--ah-display); font-weight: 200; font-size: 26px; line-height: 1.12; letter-spacing: -.02em; margin: 0; color: var(--ah-ink); }
.finding { margin: 0; font-size: 15px; line-height: 1.55; color: var(--ah-ink); max-width: 68ch; }
.hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }

.btn { height: 36px; padding: 0 16px; border-radius: 9px; border: 0; font-weight: 700; font-size: 14px; cursor: pointer; display: inline-flex;
  align-items: center; gap: 6px; white-space: nowrap; text-decoration: none; transition: transform 80ms var(--ah-ease), background 80ms var(--ah-ease); }
.btn:hover { transform: translateY(-1px); text-decoration: none; }
.btn-primary { background: var(--ah-hero); color: var(--ah-on-hero); }
.btn-primary:hover { background: var(--ah-hero-hover); }
.btn-secondary { background: transparent; color: var(--ah-hero); box-shadow: inset 0 0 0 1px var(--ah-outline); }
.btn-secondary:hover { background: var(--ah-tint); }
.btn-ghost { background: transparent; color: var(--ah-ink-2); }
.btn-ghost:hover { background: var(--ah-control-2); }
.btn-sm { height: 32px; font-size: 13.5px; padding: 0 12px; }
.btn svg { width: 16px; height: 16px; flex: none; }

/* Agenda */
.ah-hero-cols { display: grid; gap: 20px; }
.ah-agenda { padding: 12px 16px 10px 20px; }
.sec-h { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; min-height: 32px; font-weight: 600; font-size: 13px; color: var(--ah-ink-2); }
.sec-h b { font-family: var(--ah-display); font-weight: 700; font-size: 18px; letter-spacing: -.015em; color: var(--ah-ink); }
.agenda-row { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 14px; align-items: start; padding: 12px 0;
  border-top: 1px solid var(--ah-row-rule); }
.agenda-time { font-family: var(--ah-display); font-weight: 700; font-size: 17px; line-height: 1.4; letter-spacing: -.015em; color: var(--ah-ink); }
.agenda-row.is-next .agenda-time { color: var(--ah-hero); }
.agenda-row.is-past .agenda-who b { color: var(--ah-ink-2); font-weight: 600; }
.agenda-who b { display: block; font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
button.agenda-row { width: 100%; text-align: left; background: transparent; border: 0; border-top: 1px solid var(--ah-row-rule); cursor: pointer;
  border-radius: 3px; font: inherit; color: inherit; }
.agenda-row.first { border-top: 0; }
.agenda-go { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 9px; box-shadow: inset 0 0 0 1px var(--ah-outline);
  font-size: 13px; font-weight: 700; color: var(--ah-hero); white-space: nowrap; }
button.agenda-row:hover .agenda-go { background: var(--ah-tint); }
.agenda-who span { display: block; font-size: 13px; color: var(--ah-ink-2); overflow-wrap: anywhere; }
.agenda-who .agenda-notes { display: grid; gap: 2px; margin-top: 4px; }
.agenda-who .agenda-note { font-size: 13.5px; color: var(--ah-ink); }
.agenda-who .agenda-note b { display: inline; font-weight: 700; font-size: 13.5px; color: var(--ah-ink-2); }
.agenda-who .agenda-note b.breach { color: var(--ah-breach-ink); }
.agenda-who .agenda-note .agenda-draft { display: inline; font-size: 13.5px; font-weight: 700; color: var(--ah-hero); }

/* Item rows */
.list { display: grid; }
.row { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; align-items: start; padding: 14px 0; border-top: 1px solid var(--ah-row-rule); }
.list > .row:first-child { border-top: 0; }
.glyph { width: 18px; height: 18px; margin-top: 4px; display: block; }
.row-main { min-width: 0; display: grid; gap: 8px; }
.row-hit { display: grid; gap: 2px; text-align: left; border: 0; background: transparent; padding: 0; margin: 0; cursor: pointer; min-height: 24px;
  border-radius: 3px; width: 100%; }
.row-hit.static { cursor: default; }
.row-title { display: block; font-weight: 600; font-size: 15px; line-height: 1.4; overflow-wrap: anywhere; color: var(--ah-ink); }
.row-detail { display: block; font-size: 14px; line-height: 1.5; color: var(--ah-ink-2); overflow-wrap: anywhere; max-width: 72ch; }
.pack-facts { color: var(--ah-ink-2); font-size: 14px; }
.row-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-top: 2px; }
.row-actions[hidden] { display: none; }
.row-open { display: grid; gap: 8px; padding-top: 4px; }
.row-open[hidden] { display: none; }
.row-open .row-actions { padding-top: 0; }
.status { font-size: 13px; font-weight: 600; color: var(--ah-ink-2); }
.status.breach { color: var(--ah-breach-ink); font-weight: 700; }
.status.hero { color: var(--ah-hero); }

/* Chips */
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 12px; border-radius: 999px; font-weight: 600; font-size: 12.5px;
  white-space: nowrap; border: 0; cursor: pointer; text-decoration: none; transition: transform 80ms var(--ah-ease); }
.chip:hover { transform: translateY(-1px); text-decoration: none; }
span.chip { cursor: default; }
span.chip:hover { transform: none; }
.chip-source { background: var(--ah-surface-2); color: var(--ah-ink-2); }
.chip-breach { background: var(--ah-breach-tint); color: var(--ah-breach-ink); font-weight: 700; }
.chip-breach i { width: 6px; height: 6px; border-radius: 999px; background: var(--ah-breach); }
.chip-quiet { background: var(--ah-control-2); color: var(--ah-ink-2); }
.chip-quiet svg { width: 12px; height: 12px; }
.chip-rate { background: var(--ah-control-2); color: var(--ah-ink-2); }
.chip-rate[aria-pressed="true"] { background: var(--ah-hero); color: var(--ah-on-hero); }
.rate-row { display: flex; flex-wrap: wrap; gap: 6px; }
.score-row { display: flex; flex-wrap: wrap; gap: 6px; }
.score-row .chip { min-width: 32px; justify-content: center; }

/* Pipeline */
.stage-h { display: flex; align-items: baseline; gap: 8px; margin: 0; padding: 16px 0 4px; font-weight: 600; font-size: 12px; color: var(--ah-ink-2); }
.stage-h:first-child { padding-top: 0; }
.stage-h b { font-family: var(--ah-display); font-weight: 700; font-size: 17px; letter-spacing: -.015em; color: var(--ah-ink); }
.stage-h .fold-btn.is-folded .fold-chev svg { transform: rotate(-90deg); }
.dwell { display: grid; justify-items: end; gap: 6px; padding-top: 2px; }
.track { position: relative; height: 4px; border-radius: 999px; background: var(--ah-track); overflow: hidden; width: 72px; }
.track b { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--ah-hero-fill); }
.track.over b { background: var(--ah-breach-ink); }
.days { font-size: 12px; font-weight: 600; color: var(--ah-ink-2); white-space: nowrap; }
.days.over { color: var(--ah-breach-ink); font-weight: 700; }
.deal-row { grid-template-columns: 18px minmax(0, 1fr) auto; }
.deal-row .row-actions { grid-column: 2 / 4; }
.inline-form { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; min-width: 0; }
.inline-form .field { width: 120px; }
.field { height: 40px; border-radius: 9px; border: 0; padding: 0 12px; background: var(--ah-surface); box-shadow: inset 0 0 0 1px var(--ah-field);
  min-width: 0; flex: 1 1 200px; }
.field[type="date"] { flex: 0 1 168px; }
.field:focus { outline: none; box-shadow: inset 0 0 0 1.5px var(--ah-hero), 0 0 0 4px var(--ah-halo); }
.field::placeholder { color: var(--ah-ink-3); opacity: 1; }

/* Tables */
.table-wrap { overflow-x: auto; margin: 0 -16px; padding: 0 16px; }
table { border-collapse: collapse; width: 100%; min-width: 520px; font-size: 14px; border-radius: 0; }
th { text-align: left; font-weight: 700; font-size: 13px; color: var(--ah-ink-2); padding: 8px 12px 8px 0; border-bottom: 1px solid var(--ah-row-rule); white-space: nowrap; }
td { padding: 10px 12px 10px 0; border-bottom: 1px solid var(--ah-row-rule); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
.sub { display: none; font-size: 12px; color: var(--ah-ink-2); }
@media (max-width: 559px) { .hide-sm { display: none; } table.fit-sm { min-width: 0; } .sub { display: block; } }
.neg { color: var(--ah-breach-ink); font-weight: 700; }
.null { color: var(--ah-ink-3); }
/* Fund summary on the LPs tab */
.fund { display: grid; gap: 12px; }
.fund-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px 16px; align-items: start; }
.fund-stat { display: grid; gap: 2px; min-width: 0; align-content: start; }
.fund-stat span { font-weight: 600; font-size: 12px; color: var(--ah-ink-2); }
.fund-stat b { font-family: var(--ah-display); font-weight: 700; font-size: 20px; letter-spacing: -.015em; color: var(--ah-ink); }
.fund-stat small { font-size: 12px; color: var(--ah-ink-2); }
.fund-track { width: 100%; margin-top: 8px; }
th.own, td.own { padding-left: 24px; }
.sheet .chip-source { height: 32px; }
td .owed { display: block; font-size: 12px; }
.meter { display: inline-flex; align-items: center; gap: 8px; }
.meter span { position: relative; width: 48px; height: 4px; border-radius: 999px; background: var(--ah-track); overflow: hidden; }
.meter span b { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ah-hero-fill); border-radius: 999px; }

/* Sheet, toast, banner, empty */
.scrim { position: fixed; inset: 0; background: var(--ah-scrim); z-index: 40; display: grid; align-items: end; justify-items: center; }
.sheet { width: 100%; max-width: 640px; max-height: 88vh; overflow-y: auto; background: var(--ah-modal); border-radius: 12px 12px 0 0;
  box-shadow: var(--ah-elev-3); padding-block: 24px calc(24px + env(safe-area-inset-bottom, 0px));
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }
.sheet-h { display: flex; align-items: start; gap: 12px; }
.sheet-h h2 { margin: 0; font-family: var(--ah-display); font-weight: 700; font-size: 20px; letter-spacing: -.015em; }
.sheet-h .btn { margin-left: auto; }
.kv { display: grid; gap: 6px; }
.kv h3 { margin: 0; font-weight: 600; font-size: 12px; color: var(--ah-ink-2); }
.kv ul, .kv ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.kv li { overflow-wrap: anywhere; }
.kv .seg { justify-self: start; }
.kv .row-actions { padding-top: 4px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 50;
  background: var(--ah-overlay-ink); color: var(--ah-overlay-text); border-radius: 16px; box-shadow: var(--ah-elev-overlay); padding: 8px 8px 8px 16px;
  display: flex; align-items: center; gap: 12px; font-size: 13px; width: max-content; max-width: calc(100vw - 32px); }
.toast .btn { background: transparent; color: var(--ah-overlay-text); box-shadow: inset 0 0 0 1px var(--ah-overlay-edge); height: 26px; font-size: 12.5px; }
.banner { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 12px 16px; border-radius: 12px; background: var(--ah-tint); color: var(--ah-hero);
  font-weight: 600; font-size: 13.5px; }
.banner.is-warn { background: var(--ah-breach-tint); color: var(--ah-breach-ink); }
.banner > * { min-width: 0; overflow-wrap: anywhere; }
.banner span { font-weight: 400; color: var(--ah-ink); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip-filter { background: var(--ah-control-2); color: var(--ah-ink-2); }

    S.rs.running = true; S.rs.stop = false; S.rs.halted = false;
    var done = 0;
    var next = function (i) {
      if (i >= list.length || S.rs.stop) {
        S.rs.running = false; S.rs.who = null;
        if (S.rs.halted) rsNote(S.rs.note);
        else { S.rs.note = null; render(); toast(S.rs.stop ? "Research stopped." : done ? "Research done: " + plural(done, "empathy map") + " on your prep cards." : "No new people to research."); }
        return Promise.resolve();
      }
      var p = list[i]; S.rs.who = p.person.name; rsNote("Reading " + p.person.name + "'s LinkedIn in the Claude app's browser…");
      return rsOne(p).then(function (ok) { if (ok) done += 1; return pause(8000 + Math.random() * 4000); },
        function (e) { rsNote(e && e.say ? e.say : "Could not read LinkedIn for " + p.person.name + "."); if (e && e.halt) { S.rs.stop = true; S.rs.halted = true; } return e && e.halt ? null : markTried(p.key); })
        .then(function () { return next(i + 1); });
    };
    return next(0);
  }
  function halt(say) { return { halt: true, say: say }; }
  function browserError(e) {
    var c = (e && e.code) || "";
    if (c === "server_not_connected") return halt("Research runs when ant. Home is open in the Claude desktop app.");
    if (c === "not_in_manifest" || c === "approval_required" || c === "cancelled" || c === "blocked_by_policy") return halt("Research needs the Claude app's browser allowed for ant. Home.");
    return { say: "The browser did not answer. ant. tries again next time you open Home." };
  }
  function rsOne(p) {
    var a = p.person, q = [a.name, a.company].filter(Boolean).join(" ");
    var url = "https://www.linkedin.com/search/results/people/?keywords=" + encodeURIComponent(q);
    var page = "";
    return bcall("navigate", { url: url }).catch(function (e) { throw browserError(e); })
      .then(function () { return pause(3500); })
      .then(function () { return bcall("get_page_text", { max_chars: 8000 }); })
      .then(function (r) {
        var t = textOf(r);
        if (/sign in|join now|log in to linkedin|authwall/i.test(t) && !/results/i.test(t)) throw halt("Sign in to LinkedIn in the Claude app's browser to research your meetings.");
        return bcall("find", { query: a.name });
      })
      .then(function (r) {
        var t = textOf(r), lines = t.split("\n"), ref = null;
        lines.some(function (l) { var m = l.match(/ref_\d+/); if (m && /link/i.test(l)) { ref = m[0]; return true; } return false; });
        if (!ref) { var m2 = t.match(/ref_\d+/); ref = m2 ? m2[0] : null; }
        if (!ref) throw { say: "No LinkedIn profile found for " + a.name + "." };
        return bcall("computer", { action: "left_click", ref: ref, action_summary: "Opens " + a.name + "'s LinkedIn profile" });
      })
      .then(function () { return pause(4000); })
      .then(function () { return bcall("get_page_text", { max_chars: 20000 }); })
      .then(function (r) {
        page = textOf(r);
        if (!S.sample) throw halt("Allow Claude for ant. Home so it can write the empathy maps.");
        var c = p.card;
        var known = ["Meeting: " + (c.title || c.who || "") + " on " + fmtDate(c.start, false) + " at " + (c.time || ""),
          "Their role as ant. knows it: " + [a.title, a.company].filter(Boolean).join(", "),
          c.watch ? "Watch: " + c.watch : "", c.finding ? "What matters: " + c.finding : "",
          (c.open_commitments || []).map(function (x) { return (x.side === "us" ? "We owe: " : "They owe: ") + x.what; }).join("; "),
          (c.history || []).slice(0, 3).map(function (x) { return x.date + ": " + x.text; }).join("; ")].filter(Boolean).join("\n");
        return S.sample.json("You write empathy maps that help a venture investor prepare for a meeting. Below is the text of a LinkedIn page that should be " +
          a.name + "'s profile" + (a.company ? " at " + a.company : "") + ", and what the investor already knows. Reply with only a JSON object: " +
          '{"match": true or false (is this page really this person?), "name": "", "headline": "", "says": "", "thinks": "", "does": "", "feels": "", ' +
          '"company": "one line on their firm: for an investor, thesis and recent bets; for a founder or leader, stage, scale and product", ' +
          '"points": ["three specific things to raise in this meeting"]}. Each field is one plain sentence. "says" stays close to their own public words; ' +
          '"thinks" and "feels" are your reading, so write them as a reading. Leave out family, health, politics, religion and anything else not about work.\n\n' +
          "WHAT THE INVESTOR KNOWS\n" + known + "\n\nLINKEDIN PAGE TEXT\n" + page.slice(0, 16000), { modelTier: "default" });
      })
      .then(function (m) {
        if (!m || m.match === false || !m.name) throw { say: "The LinkedIn page did not look like " + a.name + "; skipped." };
        var map = { name: String(m.name || a.name), headline: String(m.headline || ""), says: String(m.says || ""), thinks: String(m.thinks || ""), does: String(m.does || ""),
          feels: String(m.feels || ""), company: String(m.company || ""), points: (m.points || []).slice(0, 3).map(String), source_url: url, read_at: nowIso(), auto: true };
        return driveDoc(map, p).then(function (link) { if (link) map.drive_url = link; return saveResearch(p.key, map); }).then(function () { return true; });
      });
  }
  function saveResearch(key, map) {
    var patch = { people: {} }; patch.people[key] = map;
    S.snap.research = S.snap.research || {}; S.snap.research.people = Object.assign({}, S.snap.research.people || {}, patch.people);
    if (!S.db) return Promise.resolve();
    var ref = S.db.doc("snap/research");
    return ref.update(patch).catch(function () { return ref.set(Object.assign({ people: {}, tried: {} }, S.snap.research)); }).catch(function () {});
  }
  function markTried(key) {
    var t = {}; t[key] = nowIso();
    S.snap.research = S.snap.research || {}; S.snap.research.tried = Object.assign({}, S.snap.research.tried || {}, t);
    if (!S.db) return Promise.resolve();
    var ref = S.db.doc("snap/research");
    return ref.update({ tried: t }).catch(function () { return ref.set(Object.assign({ people: {}, tried: {} }, S.snap.research)); }).catch(function () {});
  }
  // A Google Doc per person in the research folder, when Google Drive is connected. Failure never stops the map.
  function driveDoc(map, p) {
    if (!S.mcp) return Promise.resolve(null);
    var folderName = cfg().research_folder || "ant. research";
    var esc = function (x) { return String(x || "").replace(/[&<>]/g, function (ch) { return ch === "&" ? "&amp;" : ch === "<" ? "&lt;" : "&gt;"; }); };
    var title = dayOf(p.card.start || nowIso()) + " " + map.name + (p.person.company ? ", " + p.person.company : "");
    var html = "<h1>" + esc(map.name) + "</h1><p>" + esc(map.headline) + "</p><p>" + esc(p.card.title || "") + ", " + esc(fmtDate(p.card.start, false)) + " " + esc(p.card.time || "") + "</p>" +
      "<h2>Empathy map</h2><p><b>Says:</b> " + esc(map.says) + "</p><p><b>Thinks:</b> " + esc(map.thinks) + "</p><p><b>Does:</b> " + esc(map.does) + "</p><p><b>Feels:</b> " + esc(map.feels) + "</p>" +
      "<h2>Their company</h2><p>" + esc(map.company) + "</p><h2>Raise in the meeting</h2><ol>" + map.points.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ol>" +
      "<p>Source: LinkedIn, read in the Claude app's browser on " + esc(fmtDate(map.read_at)) + ". ant. for VCs.</p>";
    var D = "Google Drive";
    var findFolder = function () {
      return S.mcp.callTool(D, "search_files", { query: "title = '" + folderName.replace(/'/g, "\\'") + "' and mimeType = 'application/vnd.google-apps.folder'", pageSize: 1, excludeContentSnippets: true })
        .then(function (r) { var pl = r.payload || {}, f = (pl.files || pl.items || [])[0]; return f && f.id ? f.id : null; });
    };
    return (S.rsFolder ? Promise.resolve(S.rsFolder) : findFolder().then(function (id) {
      return id || S.mcp.callTool(D, "create_file", { title: folderName, contentMimeType: "application/vnd.google-apps.folder" }).then(function (r) { return (r.payload || {}).id || null; });
    })).then(function (folder) {
      S.rsFolder = folder || null;
      return S.mcp.callTool(D, "create_file", Object.assign({ title: title, textContent: html, contentMimeType: "text/html" }, folder ? { parentId: folder } : {}));
    }).then(function (r) {
      var f = r.payload || {}; return safeUrl(f.webViewLink) || safeUrl(f.alternateLink) || (f.id ? "https://docs.google.com/document/d/" + f.id + "/edit" : null);
    }).catch(function () { return null; });
  }

  // ---------------------------------------------------------------- render
  function renderTabs() {
    var rail = document.getElementById("rail-tabs"), bottom = document.getElementById("bottom-tabs"), tabs = visibleTabs();
    rail.textContent = ""; bottom.textContent = "";
    bottom.style.gridTemplateColumns = "repeat(" + tabs.length + ", 1fr)";
    tabs.forEach(function (t) {
      [rail, bottom].forEach(function (host) {
        host.appendChild(h("button", { class: "ah-tab", type: "button", role: "tab", "aria-selected": S.tab === t.key ? "true" : "false", "aria-label": t.label, title: t.label,
          "aria-controls": "view", tabindex: S.tab === t.key || (S.tab === "activity" && t.key === "today") ? "0" : "-1",
          onkeydown: function (e) {
            if (["ArrowRight", "ArrowLeft", "ArrowUp", "ArrowDown", "Home", "End"].indexOf(e.key) < 0) return;
            e.preventDefault(); e.stopPropagation();
            var i = tabs.indexOf(t), n = e.key === "Home" ? tabs[0] : e.key === "End" ? tabs[tabs.length - 1] :
              tabs[(i + (e.key === "ArrowRight" || e.key === "ArrowDown" ? 1 : tabs.length - 1)) % tabs.length];
            go(n.key); var nb = host.querySelector('[aria-label="' + n.label + '"]'); if (nb) nb.focus();
          },
          onclick: function () { var id = host.id; go(t.key); var nb = document.querySelector("#" + id + ' [aria-label="' + t.label + '"]'); if (nb) nb.focus({ preventScroll: true }); } },
          [h("span", { class: "ah-tab-ico" }, icon(t.icon, 18)), h("span", { class: "lbl" }, t.label)]));
      });
    });
    var ab = document.getElementById("activity-btn");
    if (ab) { ab.textContent = ""; ab.appendChild(icon(ICON.clock, 18)); ab.appendChild(h("span", { class: "act-lbl" }, "Activity")); ab.setAttribute("aria-current", S.tab === "activity" ? "page" : "false"); }
  }
  function hhmm(iso) { var w = wall(Date.parse(iso)); return w ? DAYS[w.wd] + " " + pad(w.hh) + ":" + pad(w.mm) : ""; }
  // One "last check" time for the whole page: the newest finished run, else the brief's own time.
  function lastCheckAt() {
    var b = S.snap.brief || {}, best = Date.parse(b.as_of || "") || 0;
    (S.runs || []).forEach(function (r) { var t = Date.parse(r.finished || ""); if (t > best) best = t; });
    return best || null;
  }
  // A check is late when the next scheduled one has passed by 45 minutes and none has started. Weekends and nights
  // follow the schedule the last run wrote down; a Home from before that falls back to weekday working hours.
  function checkLate() {
    var b = S.snap.brief || {}, last = (S.runs || [])[0] || null, now = Date.now();
    if (last && !last.finished && now - Date.parse(last.started || "") < 50 * 60e3) return false;  // a check is running
    var nextAt = Date.parse((last ? last.next_check_at : b.next_check_at) || "");
    if (nextAt) return now > nextAt + 45 * 60e3;
    var when = lastCheckAt(), w = wall(), wd = w.wd, hr = w.hh;
    return !!when && wd > 0 && wd < 6 && hr >= 9 && hr < 20 && now - when > 2 * 3600e3 + 15 * 60e3;
  }
  function banners(host) {
    var c = cfg(), b = S.snap.brief || {};
    if (S.rs.running) host.appendChild(h("div", { class: "banner banner-line", role: "status" }, [h("span", { id: "rs-note" }, S.rs.note || ""),
      S.rs.running ? h("button", { class: "btn btn-ghost btn-sm", type: "button", style: "margin-left:auto", onclick: function () { S.rs.stop = true; rsNote("Stopping after this person…"); } }, "Stop") :
      h("button", { class: "btn btn-ghost btn-sm", type: "button", style: "margin-left:auto", onclick: function () { S.rs.note = null; render(); } }, "Dismiss")]));
    if (c.demo) {
      var note = h("div", { class: "banner", role: "note" }, [h("span", null, [h("b", null, "Sample data"), " from a made-up fund, Quillwater Ventures."])]);
      if (S.static && S.demo) {
        var pick = h("select", { class: "field demo-pick", "aria-label": "View as" });
        S.demo.order.forEach(function (k) { var o = h("option", { value: k }, S.demo.members[k].label); if (k === S.demoKey) o.selected = true; pick.appendChild(o); });
        pick.addEventListener("change", function () { loadDemo(pick.value); });
        note.appendChild(h("label", { class: "demo-view" }, [h("span", null, "View as"), h("span", { class: "select" }, [pick, icon(ICON.chev, 16)])]));
      }
      host.appendChild(note); return;
    }
    if (S.readOnly) host.appendChild(h("div", { class: "banner", role: "note" }, "You are viewing someone else's ant. Home. It is read-only."));
    (b.unavailable || []).forEach(function (u) {
      var who = u.label || u.source, at = u.since ? hhmm(u.since) : "";
      var said = u.status === "revoked" ? who + ": access revoked" + (at ? " at " + at : "") : u.status === "rate_limited" ? who + " was busy" + (at ? " at " + at : "") :
        u.status === "missing" ? who + " is not connected" : who + " could not be read" + (at ? " at " + at : "");
      host.appendChild(h("div", { class: "banner is-warn", role: "status" }, [said + ".",
        h("span", null, u.status === "rate_limited" ? "ant. catches up at the next check. Home shows what it last knew." :
          "Home shows what it last knew. Reconnect it in the Claude app's connector settings.")]));
    });
    // The newest check found its safety guard off and stopped before reading anything.
    var newest = (S.runs || [])[0];
    if (newest && newest.status === "guard_off") host.appendChild(h("div", { class: "banner is-warn", role: "alert" }, [
      "ant. stopped at " + hhmm(newest.started) + ": its safety guard did not load, so it read nothing.",
      h("span", null, "Reinstall the ant. plugin, then say “check in” in Claude. Checks stay stopped until the guard loads.")]));
    // The scheduled check did not come: the task is off, paused or waiting for an approval.
    var when = lastCheckAt();
    if (when && c.home_url && !(newest && newest.status === "guard_off") && checkLate()) host.appendChild(h("div", { class: "banner is-warn", role: "status" }, ["ant. has not checked since " + hhmm(new Date(when).toISOString()) + ".",
      h("span", null, "In Claude, open Scheduled tasks. Check that “ant.” is on, with Automatically approve turned on.")]));
  }
  function render() {
    if (S.tab !== "activity" && !tabShown(S.tab)) S.tab = "today";
    renderTabs();
    var view = document.getElementById("view"), banner = document.getElementById("banner-slot");
    view.textContent = ""; banner.textContent = "";
    var d = wall();
    document.getElementById("hdr-date").textContent = DAYS[d.wd] + " " + pad(d.d) + " " + MONTHS[d.m - 1];
    var live = document.getElementById("hdr-live"), liveText = document.getElementById("hdr-live-text"), at = lastCheckAt();
    if (at) {
      var age = Date.now() - at, old = age > 3 * 3600e3, t = wall(at);
      live.className = "ah-live" + (old ? " is-old" : "");
      live.parentNode.className = "ah-hdr" + (old ? " is-old" : "");
      liveText.textContent = "";
      liveText.appendChild(h("span", { class: "ah-live-pre" }, old ? "Last check " : "As of "));
      liveText.appendChild(document.createTextNode((wallDay(t) === wallDay(d) ? "" : DAYS[t.wd] + " ") + pad(t.hh) + ":" + pad(t.mm)));
      live.setAttribute("title", liveText.textContent);
    } else { live.className = "ah-live"; liveText.textContent = S.loaded ? "Waiting" : "Loading"; }
    if (!S.loaded && !S.error) {
      view.appendChild(skeletonCard()); view.appendChild(skeletonCard());
      if (S.slow) view.appendChild(h("p", { class: "prov" }, "Still loading. If this stays, reload the page."));
      return;
    }
    if (S.error === "no-runtime" || S.error === "no-db") {
      view.appendChild(emptyCard("Open ant. Home in the Claude app", "This page shows your private brief when you open it from your Claude account. To create yours, ask Claude to “set up ant.”."));
      return;
    }
    if (S.error === "db-error") {
      view.appendChild(emptyCard("ant. Home could not load its data", "Reload the page. If it keeps happening, ask Claude to “check ant.”."));
      return;
    }
    banners(banner);
    var parts = S.tab === "pipeline" ? viewPipeline() : S.tab === "people" ? viewPeople() : S.tab === "portfolio" ? viewPortfolio() : S.tab === "lps" ? viewLps() :
      S.tab === "activity" ? viewActivity() : S.tab === "ask" ? viewAsk() : viewToday();
    parts.forEach(function (p) { if (p) view.appendChild(p); });
    enhance(view);
  }

  // ---------------------------------------------------------------- keyboard
  // Single-key shortcuts are on by default only with a mouse: on a touch screen a stray key would act.
  var coarse = false; try { coarse = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches); } catch (e) {}
  try { var kv_ = localStorage.getItem("ant.keys"); S.keys = kv_ ? kv_ !== "off" : !coarse; } catch (e) { S.keys = !coarse; }
  document.addEventListener("keydown", function (e) {
    var sheet = document.querySelector(".sheet");
    if (e.key === "Tab" && sheet) {
      var f = Array.prototype.filter.call(sheet.querySelectorAll("button, a[href], input, select, textarea"), function (x) { return x.offsetParent; });
      if (f.length && (e.shiftKey ? document.activeElement === f[0] : document.activeElement === f[f.length - 1])) { e.preventDefault(); (e.shiftKey ? f[f.length - 1] : f[0]).focus(); }
      else if (f.length && !sheet.contains(document.activeElement)) { e.preventDefault(); f[0].focus(); }
      return;
    }
    if (e.key !== "Escape" && !S.keys) return;
    if (e.key === "Escape") { if (document.querySelector(".scrim")) { closeOverlay(); return; } if (S.open) { var o = S.open; S.open = null; render(); focusId(o); } return; }
    var tag = e.target && e.target.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || e.metaKey || e.ctrlKey || e.altKey || document.querySelector(".scrim")) return;
    var hits = Array.prototype.filter.call(document.querySelectorAll("#view .row-hit[data-id]"), function (x) { return x.offsetParent; }), i = hits.indexOf(document.activeElement);
    if (e.key === "j" || e.key === "k") { e.preventDefault(); var n = hits[i < 0 ? 0 : Math.max(0, Math.min(hits.length - 1, i + (e.key === "j" ? 1 : -1)))]; if (n) n.focus(); return; }
    if (e.key === "?") { openHelp(); return; }
    if (e.key === "/") { e.preventDefault(); openQuick(); return; }
    var it = i >= 0 ? hits[i]._item : null; if (!it) return;
    if (e.key === "a" && (it.actions || []).indexOf("done") >= 0) markDone(it);
    else if (e.key === "s" && it.kind !== "deal" && it.kind !== "review") snooze(it, morning(1), "tomorrow 08:00");
    else if (e.key === "1" || e.key === "2" || e.key === "3") { rate(it, ["useful", "not_useful", "wrong"][Number(e.key) - 1]); toast("Thanks. ant. tunes itself from this on Sunday."); focusId(hits[i].getAttribute("data-id")); }
  });
  document.getElementById("help-btn").addEventListener("click", openHelp);
  document.getElementById("ask-btn").appendChild(icon(ICON.search, 18));
  document.getElementById("ask-btn").addEventListener("click", function () { openQuick(); });
  document.getElementById("activity-btn").addEventListener("click", function () { go(S.tab === "activity" ? "today" : "activity"); });
  document.getElementById("theme-btn").addEventListener("click", function () { setTheme(theme() === "dark" ? "light" : "dark"); });
  paintThemeButton();

  render();
  startDb();
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("sample").then(function (fn) { S.sample = fn || null; if (S.tab === "ask") render(); }).catch(function () { S.sample = null; });
    if (!S.static) window.claude.use("mcp").then(function (m) { S.mcp = m || null; maybeAutoResearch(); }).catch(function () { S.mcp = null; });
  } else { S.sample = null; S.mcp = null; }
})();
</script>
