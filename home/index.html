/* ant. Home on the Anthill design system, Evergreen v2026.09.08.
   Layout: one column with a bottom tab bar under 760px; a 64px rail above it; hero and agenda side by side from 1100px. */
:root { color-scheme: light;
  --ah-hero: #344C3D; --ah-hero-fill: #344C3D; --ah-hero-hover: #263A2E;
  --ah-sage: #BFCFBB; --ah-mid-sage: #8EA58C;
  --ah-tint: #EDF2EC; --ah-tint-hover: #DCE6D9;
  --ah-breach: #F87171; --ah-breach-ink: #B3261E; --ah-breach-tint: #FEF0EF;
  --ah-page: #F4F6F2; --ah-surface: #FFFFFF; --ah-modal: #FFFFFF;
  --ah-surface-2: #EDF2EC; --ah-control-2: #E7EBE3;
  --ah-ink: #0B0B0C; --ah-ink-2: #55555C; --ah-ink-3: #6E6E76; --ah-on-hero: #FFFFFF;
  --ah-overlay-ink: #0B0B0C; --ah-overlay-text: #F4F6F2; --ah-overlay-edge: rgba(244, 246, 242, .35);
  --ah-row-rule: rgba(11, 11, 12, .06); --ah-outline: rgba(52, 76, 61, .32); --ah-rail-edge: rgba(11, 11, 12, .05);
  --ah-field: rgba(11, 11, 12, .46); --ah-halo: rgba(52, 76, 61, .26); --ah-scrim: rgba(11, 11, 12, .32);
  --ah-track: #BFCFBB;
  --ah-elev-1: 0 1px 2px rgba(11, 11, 12, .04), 0 14px 30px -22px rgba(11, 11, 12, .35);
  --ah-elev-2: 0 1px 2px rgba(11, 11, 12, .04), 0 24px 48px -28px rgba(11, 11, 12, .35);
  --ah-elev-3: 0 2px 6px rgba(11, 11, 12, .08), 0 40px 80px -30px rgba(11, 11, 12, .5);
  --ah-elev-hero: 0 1px 2px rgba(11, 11, 12, .04), 0 30px 56px -30px rgba(52, 76, 61, .45);
  --ah-elev-tile: 0 8px 16px -10px rgba(11, 11, 12, .3);
  --ah-elev-overlay: 0 24px 48px -20px rgba(11, 11, 12, .6);
  --ah-display: "Raleway", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --ah-body: "Nunito", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --ah-ease: cubic-bezier(.2, .8, .2, 1);
}
/* Light is the default on every device. Dark (Inkwell) is the user's choice, set by the switch in the header and remembered. */
:root[data-ah-theme="dark"] {
  --ah-hero: #BFCFBB; --ah-hero-fill: #8EA58C; --ah-hero-hover: #CFDCCB;
  --ah-tint: rgba(191, 207, 187, .14); --ah-tint-hover: rgba(191, 207, 187, .22);
  --ah-breach-ink: #FB9797; --ah-breach-tint: rgba(248, 113, 113, .15);
  --ah-page: #0E1310; --ah-surface: #172019; --ah-modal: #233027;
  --ah-surface-2: #111713; --ah-control-2: #223028;
  --ah-ink: #F4F6F2; --ah-ink-2: #ABB4AC; --ah-ink-3: #949E96; --ah-on-hero: #0E1310;
  --ah-overlay-ink: #F4F6F2; --ah-overlay-text: #0B0B0C; --ah-overlay-edge: rgba(11, 11, 12, .3);
  --ah-row-rule: rgba(244, 246, 242, .07); --ah-outline: rgba(191, 207, 187, .36); --ah-rail-edge: rgba(244, 246, 242, .06);
  --ah-field: rgba(244, 246, 242, .42); --ah-halo: rgba(191, 207, 187, .3); --ah-scrim: rgba(0, 0, 0, .55);
  --ah-track: #2C3A30;
  --ah-elev-1: 0 1px 2px rgba(0, 0, 0, .3), 0 14px 30px -22px rgba(0, 0, 0, .85);
  --ah-elev-2: 0 1px 2px rgba(0, 0, 0, .3), 0 24px 48px -28px rgba(0, 0, 0, .85);
  --ah-elev-3: 0 2px 6px rgba(0, 0, 0, .35), 0 40px 80px -30px rgba(0, 0, 0, .9);
  --ah-elev-hero: 0 1px 2px rgba(0, 0, 0, .3), 0 30px 56px -30px rgba(0, 0, 0, .85);
  --ah-elev-tile: 0 8px 16px -10px rgba(0, 0, 0, .7);
  --ah-elev-overlay: 0 24px 48px -20px rgba(0, 0, 0, .8);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ah-page); color: var(--ah-ink); font-family: var(--ah-body); font-size: 15px; line-height: 1.55;
  -webkit-font-smoothing: antialiased; font-feature-settings: "lnum" 1, "tnum" 1; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ah-page); }
button, input, select { font: inherit; color: inherit; }
a { color: var(--ah-hero); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--ah-hero); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; }
p { text-wrap: pretty; }

/* Shell */
.ah-shell { display: grid; grid-template-columns: 1fr; min-height: 100vh; }
.ah-rail { display: none; }
.ah-main { min-width: 0; padding-block: 16px calc(80px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ah-main-inner { max-width: 1080px; margin: 0 auto; display: grid; gap: 20px; }
.ah-hdr { display: flex; align-items: center; gap: 12px; min-height: 32px; }
.ah-brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.ah-mark { width: 24px; height: 24px; display: block; flex: none; }
.ah-name { font-family: var(--ah-body); font-weight: 800; font-size: 22px; line-height: 1; letter-spacing: -.02em; color: var(--ah-ink); }
.ah-date { margin-left: auto; font-weight: 600; font-size: 15px; color: var(--ah-ink-2); white-space: nowrap; }
.ah-live { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; flex: none;
  background: var(--ah-tint); color: var(--ah-hero); font-weight: 600; font-size: 11.5px; white-space: nowrap; }
.ah-live i { width: 6px; height: 6px; border-radius: 999px; background: var(--ah-mid-sage); animation: ah-pulse 2.4s var(--ah-ease) infinite; }
.ah-live.is-old { background: var(--ah-control-2); color: var(--ah-ink-2); }
.ah-live.is-old i { animation: none; background: var(--ah-ink-2); }
@keyframes ah-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
.ah-help { width: 40px; height: 40px; margin: -8px -10px -8px -6px; border: 0; padding: 0; background: transparent; cursor: pointer;
  display: grid; place-items: center; flex: none; border-radius: 9px; }
.ah-help span { width: 19px; height: 19px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px var(--ah-outline); color: var(--ah-hero);
  font-weight: 800; font-size: 11.5px; display: grid; place-items: center; transition: transform 80ms var(--ah-ease); }
.ah-help:hover span { transform: translateY(-1px); }
.ah-icon-btn { width: 40px; height: 40px; margin: -8px -6px; border: 0; padding: 0; background: transparent; cursor: pointer; flex: none;
  display: grid; place-items: center; border-radius: 9px; color: var(--ah-hero); }
.ah-icon-btn svg { width: 18px; height: 18px; transition: transform 80ms var(--ah-ease); }
.ah-icon-btn:hover svg { transform: translateY(-1px); }
.ah-icon-btn[aria-current="page"] { background: var(--ah-tint); }
.act-lbl { display: none; font-weight: 700; font-size: 13px; }
@media (min-width: 760px) { #activity-btn { width: auto; padding: 0 12px; margin: -8px 0; gap: 6px; display: inline-flex; align-items: center; } #activity-btn .act-lbl { display: inline; } }
@media (pointer: coarse) { .keys-only { display: none; } }
.seg { display: inline-flex; gap: 4px; padding: 2px; border-radius: 999px; background: var(--ah-control-2); }
.seg .chip { background: transparent; color: var(--ah-ink-2); }
.seg .chip[aria-pressed="true"] { background: var(--ah-hero); color: var(--ah-on-hero); }

/* Tabs: bottom bar on phones, rail from 760px */
.ah-tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--ah-surface); box-shadow: 0 -1px 0 var(--ah-rail-edge); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.ah-tab { display: grid; justify-items: center; gap: 2px; padding: 6px 2px; min-height: 56px; border: 0; background: transparent;
  color: var(--ah-ink-2); font-weight: 600; font-size: 11.5px; cursor: pointer; border-radius: 9px; }
.ah-tab svg { width: 18px; height: 18px; }
.ah-tab-ico { width: 44px; height: 28px; border-radius: 9px; display: grid; place-items: center; transition: background 120ms var(--ah-ease); }
.ah-tab[aria-selected="true"] { color: var(--ah-hero); }
.ah-tab[aria-selected="true"] .ah-tab-ico { background: var(--ah-hero); color: var(--ah-on-hero); }

/* Tiles */
/* Only controls lift under the pointer: a card you read stays still. */
.card { background: var(--ah-surface); border-radius: 12px; box-shadow: var(--ah-elev-1); padding: 16px; min-width: 0; }
.ruled { position: relative; overflow: hidden; box-shadow: var(--ah-elev-hero); }
.ruled::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--ah-hero-fill); }
.ruled.is-breach::before { background: var(--ah-breach); }
.ruled:hover { box-shadow: var(--ah-elev-hero); }
.ah-hero-card { padding: 24px 20px 20px 24px; display: grid; gap: 16px; }
.kicker { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; color: var(--ah-ink-2); }
.kicker i { width: 7px; height: 7px; border-radius: 999px; background: var(--ah-hero-fill); flex: none; }
.is-breach .kicker i { background: var(--ah-breach); }
.statement, .finding, .sheet-h h2, .sheet-sub, .fold-btn b, .kv h3, .row-title, .tl-text, .fact-v, dd { overflow-wrap: anywhere; }
.statement { font-family: var(--ah-display); font-weight: 200; font-size: 26px; line-height: 1.12; letter-spacing: -.02em; margin: 0; color: var(--ah-ink); }
.finding { margin: 0; font-size: 15px; line-height: 1.55; color: var(--ah-ink); max-width: 68ch; }
.hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }

.btn { height: 36px; padding: 0 16px; border-radius: 9px; border: 0; font-weight: 700; font-size: 14px; cursor: pointer; display: inline-flex;
  align-items: center; gap: 6px; white-space: nowrap; text-decoration: none; transition: transform 80ms var(--ah-ease), background 80ms var(--ah-ease); }
.btn:hover { transform: translateY(-1px); text-decoration: none; }
.btn-primary { background: var(--ah-hero); color: var(--ah-on-hero); }
.btn-primary:hover { background: var(--ah-hero-hover); }
.btn-secondary { background: transparent; color: var(--ah-hero); box-shadow: inset 0 0 0 1px var(--ah-outline); }
.btn-secondary:hover { background: var(--ah-tint); }
.btn-ghost { background: transparent; color: var(--ah-ink-2); }
.btn-ghost:hover { background: var(--ah-control-2); }
.btn-sm { height: 32px; font-size: 13.5px; padding: 0 12px; }
.btn svg { width: 16px; height: 16px; flex: none; }

/* Agenda */
.ah-hero-cols { display: grid; gap: 20px; }
.ah-agenda { padding: 12px 16px 10px 20px; }
.sec-h { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; min-height: 32px; font-weight: 600; font-size: 13px; color: var(--ah-ink-2); }
.sec-h b { font-family: var(--ah-display); font-weight: 700; font-size: 18px; letter-spacing: -.015em; color: var(--ah-ink); }
.agenda-row { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 14px; align-items: start; padding: 12px 0;
  border-top: 1px solid var(--ah-row-rule); }
.agenda-time { font-family: var(--ah-display); font-weight: 700; font-size: 17px; line-height: 1.4; letter-spacing: -.015em; color: var(--ah-ink); }
.agenda-row.is-next .agenda-time { color: var(--ah-hero); }
.agenda-row.is-past .agenda-who b { color: var(--ah-ink-2); font-weight: 600; }
.agenda-who b { display: block; font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
button.agenda-row { width: 100%; text-align: left; background: transparent; border: 0; border-top: 1px solid var(--ah-row-rule); cursor: pointer;
  border-radius: 3px; font: inherit; color: inherit; }
.agenda-row.first { border-top: 0; }
.agenda-go { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 9px; box-shadow: inset 0 0 0 1px var(--ah-outline);
  font-size: 13px; font-weight: 700; color: var(--ah-hero); white-space: nowrap; }
button.agenda-row:hover .agenda-go { background: var(--ah-tint); }
.agenda-who span { display: block; font-size: 13px; color: var(--ah-ink-2); overflow-wrap: anywhere; }
.agenda-who .agenda-notes { display: grid; gap: 2px; margin-top: 4px; }
.agenda-who .agenda-note { font-size: 13.5px; color: var(--ah-ink); }
.agenda-who .agenda-note b { display: inline; font-weight: 700; font-size: 13.5px; color: var(--ah-ink-2); }
.agenda-who .agenda-note b.breach { color: var(--ah-breach-ink); }
.agenda-who .agenda-note .agenda-draft { display: inline; font-size: 13.5px; font-weight: 700; color: var(--ah-hero); }

/* Item rows */
.list { display: grid; }
.row { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; align-items: start; padding: 14px 0; border-top: 1px solid var(--ah-row-rule); }
.list > .row:first-child { border-top: 0; }
.glyph { width: 18px; height: 18px; margin-top: 4px; display: block; }
.row-main { min-width: 0; display: grid; gap: 8px; }
.row-hit { display: grid; gap: 2px; text-align: left; border: 0; background: transparent; padding: 0; margin: 0; cursor: pointer; min-height: 24px;
  border-radius: 3px; width: 100%; }
.row-hit.static { cursor: default; }
.row-title { display: block; font-weight: 600; font-size: 15px; line-height: 1.4; overflow-wrap: anywhere; color: var(--ah-ink); }
.row-detail { display: block; font-size: 14px; line-height: 1.5; color: var(--ah-ink-2); overflow-wrap: anywhere; max-width: 72ch; }
.pack-facts { color: var(--ah-ink-2); font-size: 14px; }
.row-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-top: 2px; }
.row-actions[hidden] { display: none; }
.row-open { display: grid; gap: 8px; padding-top: 4px; }
.row-open[hidden] { display: none; }
.row-open .row-actions { padding-top: 0; }
.status { font-size: 13px; font-weight: 600; color: var(--ah-ink-2); }
.status.breach { color: var(--ah-breach-ink); font-weight: 700; }
.status.hero { color: var(--ah-hero); }

/* Chips */
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 12px; border-radius: 999px; font-weight: 600; font-size: 12.5px;
  white-space: nowrap; border: 0; cursor: pointer; text-decoration: none; transition: transform 80ms var(--ah-ease); }
.chip:hover { transform: translateY(-1px); text-decoration: none; }
span.chip { cursor: default; }
span.chip:hover { transform: none; }
.chip-source { background: var(--ah-surface-2); color: var(--ah-ink-2); }
.chip-breach { background: var(--ah-breach-tint); color: var(--ah-breach-ink); font-weight: 700; }
.chip-breach i { width: 6px; height: 6px; border-radius: 999px; background: var(--ah-breach); }
.chip-quiet { background: var(--ah-control-2); color: var(--ah-ink-2); }
.chip-quiet svg { width: 12px; height: 12px; }
.chip-rate { background: var(--ah-control-2); color: var(--ah-ink-2); }
.chip-rate[aria-pressed="true"] { background: var(--ah-hero); color: var(--ah-on-hero); }
.rate-row { display: flex; flex-wrap: wrap; gap: 6px; }
.score-row { display: flex; flex-wrap: wrap; gap: 6px; }
.score-row .chip { min-width: 32px; justify-content: center; }

/* Pipeline */
.stage-h { display: flex; align-items: baseline; gap: 8px; margin: 0; padding: 16px 0 4px; font-weight: 600; font-size: 12px; color: var(--ah-ink-2); }
.stage-h:first-child { padding-top: 0; }
.stage-h b { font-family: var(--ah-display); font-weight: 700; font-size: 17px; letter-spacing: -.015em; color: var(--ah-ink); }
.stage-h .fold-btn.is-folded .fold-chev svg { transform: rotate(-90deg); }
.dwell { display: grid; justify-items: end; gap: 6px; padding-top: 2px; }
.track { position: relative; height: 4px; border-radius: 999px; background: var(--ah-track); overflow: hidden; width: 72px; }
.track b { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--ah-hero-fill); }
.track.over b { background: var(--ah-breach-ink); }
.days { font-size: 12px; font-weight: 600; color: var(--ah-ink-2); white-space: nowrap; }
.days.over { color: var(--ah-breach-ink); font-weight: 700; }
.deal-row { grid-template-columns: 18px minmax(0, 1fr) auto; }
.deal-row .row-actions { grid-column: 2 / 4; }
.inline-form { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; min-width: 0; }
.inline-form .field { width: 120px; }
.field { height: 40px; border-radius: 9px; border: 0; padding: 0 12px; background: var(--ah-surface); box-shadow: inset 0 0 0 1px var(--ah-field);
  min-width: 0; flex: 1 1 200px; }
.field[type="date"] { flex: 0 1 168px; }
.field:focus { outline: none; box-shadow: inset 0 0 0 1.5px var(--ah-hero), 0 0 0 4px var(--ah-halo); }
.field::placeholder { color: var(--ah-ink-3); opacity: 1; }

/* Tables */
.table-wrap { overflow-x: auto; margin: 0 -16px; padding: 0 16px; }
table { border-collapse: collapse; width: 100%; min-width: 520px; font-size: 14px; border-radius: 0; }
th { text-align: left; font-weight: 700; font-size: 13px; color: var(--ah-ink-2); padding: 8px 12px 8px 0; border-bottom: 1px solid var(--ah-row-rule); white-space: nowrap; }
td { padding: 10px 12px 10px 0; border-bottom: 1px solid var(--ah-row-rule); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
.sub { display: none; font-size: 12px; color: var(--ah-ink-2); }
@media (max-width: 559px) { .sr-sm { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; } .hide-sm { display: none; } table.fit-sm { min-width: 0; } .sub { display: block; } }
.neg { color: var(--ah-breach-ink); font-weight: 700; }
.null { color: var(--ah-ink-3); }
/* Fund summary on the LPs tab */
.fund { display: grid; gap: 12px; }
.fund-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px 16px; align-items: start; }
.fund-stat { display: grid; gap: 2px; min-width: 0; align-content: start; }
.fund-stat span { font-weight: 600; font-size: 12px; color: var(--ah-ink-2); }
.fund-stat b { font-family: var(--ah-display); font-weight: 700; font-size: 20px; letter-spacing: -.015em; color: var(--ah-ink); }
.fund-stat small { font-size: 12px; color: var(--ah-ink-2); }
.fund-track { width: 100%; margin-top: 8px; }
th.own, td.own { padding-left: 24px; }
.sheet .chip-source { height: 32px; }
td .owed { display: block; font-size: 12px; }
.meter { display: inline-flex; align-items: center; gap: 8px; }
.meter span { position: relative; width: 48px; height: 4px; border-radius: 999px; background: var(--ah-track); overflow: hidden; }
.meter span b { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ah-hero-fill); border-radius: 999px; }

/* Sheet, toast, banner, empty */
.scrim { position: fixed; inset: 0; background: var(--ah-scrim); z-index: 40; display: grid; align-items: end; justify-items: center; }
.sheet { width: 100%; max-width: 640px; max-height: 88vh; overflow-y: auto; background: var(--ah-modal); border-radius: 12px 12px 0 0;
  box-shadow: var(--ah-elev-3); padding-block: 24px calc(24px + env(safe-area-inset-bottom, 0px));
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }
.sheet-h { display: flex; align-items: start; gap: 12px; }
.sheet-h h2 { margin: 0; font-family: var(--ah-display); font-weight: 700; font-size: 20px; letter-spacing: -.015em; }
.sheet-h .btn { margin-left: auto; flex: none; }
.sheet-h .btn:first-child:not(:last-child) { margin-left: -8px; }
.sheet-h h2 { flex: 1 1 auto; min-width: 0; }
.kv { display: grid; gap: 6px; }
.kv h3 { margin: 0; font-weight: 600; font-size: 12px; color: var(--ah-ink-2); }
.kv ul, .kv ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.kv li { overflow-wrap: anywhere; }
.kv .seg { justify-self: start; }
.kv .row-actions { padding-top: 4px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + 64px + env(safe-area-inset-bottom, 0px)); z-index: 50;
  background: var(--ah-overlay-ink); color: var(--ah-overlay-text); border-radius: 16px; box-shadow: var(--ah-elev-overlay); padding: 8px 8px 8px 16px;
  display: flex; align-items: center; gap: 12px; font-size: 13px; width: max-content; max-width: calc(100vw - 32px); }
.toast .btn { background: transparent; color: var(--ah-overlay-text); box-shadow: inset 0 0 0 1px var(--ah-overlay-edge); height: 26px; font-size: 12.5px; }
.banner { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 12px 16px; border-radius: 12px; background: var(--ah-tint); color: var(--ah-hero);
  font-weight: 600; font-size: 13.5px; }
.banner.is-warn { background: var(--ah-breach-tint); color: var(--ah-breach-ink); }
.banner > * { min-width: 0; overflow-wrap: anywhere; }
.banner span { font-weight: 400; color: var(--ah-ink); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip-filter { background: var(--ah-control-2); color: var(--ah-ink-2); }
.chip-filter[aria-pressed="true"] { background: var(--ah-hero); color: var(--ah-on-hero); }
.field-sm { height: 32px; flex: 1 1 160px; max-width: 280px; border-radius: 999px; padding: 0 16px; }
.demo-view { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; }
.demo-view span { font-weight: 600; color: var(--ah-hero); white-space: nowrap; }
.demo-pick { color: var(--ah-ink); }
.md { display: grid; gap: 8px; font-size: 14px; }
.md h3 { margin: 8px 0 0; font-weight: 700; font-size: 14px; color: var(--ah-ink); }
.md ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.md p { margin: 0; }
.watch { margin: 0; font-weight: 700; color: var(--ah-breach-ink); }
.empty { display: grid; gap: 6px; padding: 24px 20px; color: var(--ah-ink-2); }
.empty b { font-family: var(--ah-display); font-weight: 200; font-size: 26px; line-height: 1.15; color: var(--ah-ink); letter-spacing: -.02em; }
.skel { height: 12px; border-radius: 999px; background: var(--ah-surface-2); animation: ah-pulse 1.4s var(--ah-ease) infinite; }
.evidence { margin: 0; font-size: 12.5px; color: var(--ah-ink-3); }
.prov { margin: 0; font-size: 12.5px; color: var(--ah-ink-3); }
.answer-code { margin: 0; padding: 12px; border-radius: 9px; background: var(--ah-tint); overflow-x: auto; font: 13.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; }
.tldr .prov { color: var(--ah-ink-2); }
.done-note { font-size: 13px; font-weight: 600; color: var(--ah-hero); }
.link-btn { background: none; border: 0; padding: 0 4px; min-height: 32px; display: inline-flex; align-items: center; font: inherit; color: var(--ah-hero); cursor: pointer; text-align: left; }
.link-btn:hover { text-decoration: underline; }
.link-btn:focus-visible { outline: 2px solid var(--ah-hero); outline-offset: 2px; border-radius: 3px; }
.draft-note { margin: 0; font-size: 13.5px; line-height: 1.5; color: var(--ah-ink-2); overflow-wrap: anywhere; }
.draft-note b { font-weight: 600; color: var(--ah-ink); }

/* Section folds: every section header is a button. A folded section keeps its count, its urgent count and its top line. */
.fold-btn { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 40px; margin: 0; padding: 0; border: 0; background: transparent;
  cursor: pointer; text-align: left; font: inherit; color: inherit; border-radius: 9px; }
.fold-chev { width: 32px; height: 32px; display: grid; place-items: center; flex: none; color: var(--ah-ink-2); border-radius: 9px; }
.fold-chev svg { width: 16px; height: 16px; transition: transform 160ms var(--ah-ease); }
.fold-btn:hover .fold-chev { background: var(--ah-control-2); }
.is-folded .fold-chev svg { transform: rotate(-90deg); }
.sec-h .count { margin-left: auto; display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 999px;
  background: var(--ah-control-2); color: var(--ah-ink-2); font-weight: 700; font-size: 12.5px; white-space: nowrap; }
.sec-h .chip-breach + .count { margin-left: 0; }
.sec-h .chip-breach { margin-left: auto; }
.fold-peek { margin: 0; padding-left: 40px; font-size: 14px; color: var(--ah-ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
section.card.is-folded .sec-h { margin-bottom: 0; }
.fold-body[hidden], .row[hidden], tr[hidden] { display: none; }
.table-wrap.scrolls { box-shadow: inset -14px 0 12px -12px var(--ah-scrim); }
:root[data-ah-theme="dark"] .table-wrap.scrolls { box-shadow: inset -1px 0 0 var(--ah-outline), inset -14px 0 12px -12px var(--ah-scrim); }
th:last-child, td:last-child { padding-right: 0; }
.table-wrap:focus-visible { outline: 2px solid var(--ah-hero); outline-offset: 2px; }
.banner-actions { display: flex; gap: 8px; margin-left: auto; flex: none; }
@media (max-width: 399px) { .meter span { width: 40px; } }
.show-all { margin-top: 8px; }
/* The day at a glance: four cells that open their sections */
.day { display: grid; gap: 12px; }
.daystrip { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.stat { display: grid; gap: 4px; align-content: start; text-align: left; min-height: 64px; min-width: 0; padding: 12px 16px; border: 0; border-radius: 12px;
  background: var(--ah-surface); box-shadow: var(--ah-elev-1); cursor: pointer; font: inherit; color: inherit; transition: transform 80ms var(--ah-ease); }
.stat:hover { transform: translateY(-1px); }
.stat span { font-weight: 600; font-size: 13px; color: var(--ah-ink-2); }
.stat b { font-family: var(--ah-display); font-weight: 700; font-size: 22px; line-height: 1.1; letter-spacing: -.015em; color: var(--ah-ink); }
.stat small { font-size: 13px; line-height: 1.35; color: var(--ah-ink-2); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.stat small.breach { color: var(--ah-breach-ink); font-weight: 700; }
.stat.is-zero b { color: var(--ah-ink-3); }
.day-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.day-tools .lead { margin-right: auto; font-weight: 600; font-size: 13px; color: var(--ah-ink-2); }
.timeline { position: relative; height: 8px; border-radius: 999px; background: var(--ah-track); margin-top: 4px; }
.timeline i { position: absolute; top: 0; bottom: 0; border-radius: 999px; background: var(--ah-hero-fill); }
.timeline em { position: absolute; top: -4px; bottom: -4px; width: 2px; border-radius: 999px; background: var(--ah-breach); }
.tl-hours { display: flex; justify-content: space-between; font-size: 12px; color: var(--ah-ink-3); }
/* A row's other choices, one tap away */
.row-more { display: grid; gap: 8px; }
.row-more[hidden] { display: none; }
/* Selects: the app's own chevron, beside the value */
.select { position: relative; display: inline-flex; align-items: center; min-width: 0; max-width: 100%; }
.select select { appearance: none; -webkit-appearance: none; height: 32px; border-radius: 9px; padding: 0 40px 0 12px; width: auto; max-width: 280px;
  flex: none; cursor: pointer; background: var(--ah-surface); color: var(--ah-ink); }
.inline-form .select { flex: 1 1 160px; }
.inline-form .select select { height: 40px; width: 100%; max-width: 100%; }
.select svg { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--ah-ink-2); pointer-events: none; }
/* Activity */
.log-row { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--ah-row-rule); }
.list > .log-row:first-child, .log-cat + .log-row { border-top: 0; }
.log-time { font-family: var(--ah-display); font-weight: 700; font-size: 17px; letter-spacing: -.015em; color: var(--ah-ink); }
.log-main { display: grid; gap: 4px; min-width: 0; }
.log-row.is-undone .row-title { color: var(--ah-ink-2); }
.log-cat { margin: 0; padding: 16px 0 4px; font-weight: 700; font-size: 13px; color: var(--ah-ink-2); }
.log-cat:first-child { padding-top: 0; }
.ah-view { display: grid; gap: 20px; }
/* Compact: the same page, tighter */
:root[data-ah-density="compact"] body { font-size: 13.5px; line-height: 1.45; }
:root[data-ah-density="compact"] .row { padding: 10px 0; }
:root[data-ah-density="compact"] .row-main { gap: 6px; }
:root[data-ah-density="compact"] .row-title { font-size: 14px; }
:root[data-ah-density="compact"] .row-detail, :root[data-ah-density="compact"] .finding { font-size: 13px; }
:root[data-ah-density="compact"] .agenda-row { padding: 6px 0; }
:root[data-ah-density="compact"] .ah-view, :root[data-ah-density="compact"] .ah-main-inner { gap: 14px; }
:root[data-ah-density="compact"] .card { padding: 12px 16px; }
:root[data-ah-density="compact"] .stat { min-height: 56px; padding: 8px 12px; }

@media (max-width: 430px) { .ah-live-pre { display: none; } }
/* Settings and tools */
.rail-foot { margin-top: 24px; padding-top: 16px; box-shadow: 0 -1px 0 var(--ah-rail-edge); display: grid; justify-items: center; }
.ah-rail .ah-tab.is-current .ah-tab-ico { background: var(--ah-hero); color: var(--ah-on-hero); box-shadow: var(--ah-elev-tile); }
.ah-rail .ah-tab.is-current { color: var(--ah-hero); }
.tool-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; align-items: center; padding: 14px 0; border-top: 1px solid var(--ah-row-rule); }
.list > .tool-row:first-child { border-top: 0; }
.tool-row .seg { justify-self: end; flex-wrap: wrap; }
.tool-name { display: grid; gap: 2px; min-width: 0; }
.tool-name b { font-weight: 600; font-size: 15px; }
.tool-name span { font-size: 13.5px; color: var(--ah-ink-2); }
